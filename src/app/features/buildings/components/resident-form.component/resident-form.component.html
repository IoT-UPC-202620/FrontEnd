<div
  class="modal-backdrop"
  (click)="onCancel()">

  <div
    class="modal-container"
    (click)="$event.stopPropagation()">

    <header class="modal-header">
      <h2>Registrar residente</h2>

      <button
        type="button"
        class="close-btn"
        (click)="onCancel()"
        [disabled]="isSubmitting"
        aria-label="Cerrar">

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round">

          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </header>

    <form
      [formGroup]="residentForm"
      (ngSubmit)="onSubmit()"
      class="form-body"
      autocomplete="off">

      <div class="form-group">
        <label for="fullName">Nombre completo</label>
        <input
          type="text"
          id="fullName"
          formControlName="fullName"
          class="form-control"
          placeholder="Ejemplo: Ana Pérez"
          [class.is-invalid]="residentForm.get('fullName')?.invalid && residentForm.get('fullName')?.touched">
        <div class="error-text" *ngIf="residentForm.get('fullName')?.invalid && residentForm.get('fullName')?.touched">
          El nombre debe tener al menos 3 caracteres.
        </div>
      </div>

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          class="form-control"
          placeholder="residente@correo.com"
          [class.is-invalid]="residentForm.get('email')?.invalid && residentForm.get('email')?.touched">
        <div class="error-text" *ngIf="residentForm.get('email')?.invalid && residentForm.get('email')?.touched">
          Ingresa un correo válido.
        </div>
      </div>

      <div class="form-group">
        <label for="phone">Teléfono móvil</label>
        <input
          type="tel"
          id="phone"
          formControlName="phone"
          class="form-control"
          placeholder="9XXXXXXXX"
          [class.is-invalid]="residentForm.get('phone')?.invalid && residentForm.get('phone')?.touched">
        <div class="error-text" *ngIf="residentForm.get('phone')?.invalid && residentForm.get('phone')?.touched">
          El teléfono debe empezar con 9 y tener 9 dígitos.
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="documentType">Tipo de documento</label>
          <select id="documentType" formControlName="documentType" class="form-control">
            <option value="DNI">DNI</option>
            <option value="CE">CE</option>
            <option value="PASAPORTE">PASAPORTE</option>
          </select>
        </div>

        <div class="form-group">
          <label for="documentNumber">Número de documento</label>
          <input
            type="text"
            id="documentNumber"
            formControlName="documentNumber"
            class="form-control"
            placeholder="12345678"
            [class.is-invalid]="residentForm.get('documentNumber')?.invalid && residentForm.get('documentNumber')?.touched">
          <div class="error-text" *ngIf="residentForm.get('documentNumber')?.invalid && residentForm.get('documentNumber')?.touched">
            Documento inválido.
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="buildingId">Torre</label>
        <select
          id="buildingId"
          formControlName="buildingId"
          class="form-control"
          (change)="onBuildingChange()"
          [class.is-invalid]="residentForm.get('buildingId')?.invalid && residentForm.get('buildingId')?.touched">
          <option [ngValue]="null">Selecciona una torre…</option>
          <option *ngFor="let building of buildings" [ngValue]="building.idBuilding">
            {{ building.name }} — {{ building.district }}
          </option>
        </select>
        <div class="error-text" *ngIf="residentForm.get('buildingId')?.invalid && residentForm.get('buildingId')?.touched">
          Selecciona la torre.
        </div>
      </div>

      <div class="form-group">
        <label for="unitId">Unidad</label>
        <select
          id="unitId"
          formControlName="unitId"
          class="form-control"
          [class.is-invalid]="residentForm.get('unitId')?.invalid && residentForm.get('unitId')?.touched">
          <option [ngValue]="null">Selecciona una unidad…</option>
          <option *ngFor="let unit of units" [ngValue]="unit.idUnit">
            Unidad {{ unit.unitNumber }} — Piso {{ unit.floor }} ({{ unit.status }})
          </option>
        </select>
        <div class="error-text" *ngIf="residentForm.get('unitId')?.invalid && residentForm.get('unitId')?.touched">
          Selecciona la unidad.
        </div>
      </div>

      <div class="error-text" *ngIf="errorMessage" role="alert">
        {{ errorMessage }}
      </div>

      <footer class="form-footer">
        <button
          type="button"
          class="btn btn-secondary"
          (click)="onCancel()"
          [disabled]="isSubmitting">

          Cancelar
        </button>

        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="isSubmitting">

          {{ isSubmitting ? 'Registrando…' : 'Confirmar registro' }}
        </button>
      </footer>
    </form>
  </div>
</div>
